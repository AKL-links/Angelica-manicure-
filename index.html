<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Studio Angélica Nascimento</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: #624b40;
    padding: 30px 20px;
    overflow-x: hidden;

    background:
        radial-gradient(
            ellipse at top right,
            #e4b5a6,
            transparent 50%
        ),
        radial-gradient(
            ellipse at bottom left,
            #e7b9ad,
            transparent 50%
        ),
        #f5ede6;
}

/* DETALHES DO FUNDO */

.decoracao {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.decoracao::before,
.decoracao::after {
    content: "";
    position: absolute;
    width: 650px;
    height: 300px;
    border: 1px solid #b7807060;
    border-radius: 50%;
    transform: rotate(-35deg);
}

.decoracao::before {
    top: -180px;
    left: -280px;
    box-shadow: 0 20px 0 #d4a99b30;
}

.decoracao::after {
    bottom: -180px;
    right: -280px;
    box-shadow: 0 -20px 0 #d4a99b30;
}

/* CONTEÚDO PRINCIPAL */

main {
    position: relative;
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: entrada 1s ease both;
}

.logo {
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
    display: block;
}

.ornamento {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 20px auto;
    color: #b78070;
    font-size: 24px;
}

.ornamento::before,
.ornamento::after {
    content: "";
    width: 75px;
    height: 1px;
    background: #b7807080;
}

.subtitulo {
    color: #986e58;
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 15px;
}

h1 {
    font-family: Georgia, serif;
    font-size: 32px;
    font-style: italic;
    font-weight: normal;
    color: #986e58;
    margin: 10px 0;
}

.descricao {
    font-size: 14px;
    line-height: 1.7;
    color: #806257;
    margin-bottom: 30px;
}

/* BOTÕES */

.links {
    display: grid;
    gap: 15px;
}

.botao {
    position: relative;
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    min-height: 85px;
    padding: 18px;
    overflow: hidden;

    border: 1px solid #c99b88;
    border-radius: 20px;

    background: linear-gradient(
        120deg,
        #fff8f2,
        #eed5c9
    );

    color: #624b40;
    text-decoration: none;
    text-align: left;
    font-family: inherit;
    cursor: pointer;

    box-shadow: 0 7px 20px #986e5825;

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    animation: entrada .8s ease both;
}

.botao:nth-child(1) {
    animation-delay: .15s;
}

.botao:nth-child(2) {
    animation-delay: .30s;
}

.botao:nth-child(3) {
    animation-delay: .45s;
}

.botao.principal {
    background: linear-gradient(
        120deg,
        #b47b6d,
        #915b4f
    );

    color: #ffffff;
}

.botao:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px #986e5840;
}

.botao:active {
    transform: scale(.96);
}

.botao:focus-visible {
    outline: 3px solid #986e58;
    outline-offset: 4px;
}

/* EFEITO DE BRILHO */

.botao::after {
    content: "";
    position: absolute;
    top: 0;
    left: -80%;
    width: 40%;
    height: 100%;

    background: linear-gradient(
        90deg,
        transparent,
        #ffffff50,
        transparent
    );

    transform: skewX(-20deg);
    animation: brilho 6s infinite;
    pointer-events: none;
}

.botao:nth-child(2)::after {
    animation-delay: 1s;
}

.botao:nth-child(3)::after {
    animation-delay: 2s;
}

/* ÍCONES */

.icone {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    filter: drop-shadow(0 3px 3px #00000020);
}

.texto-botao {
    flex: 1;
    min-width: 0;
}

.texto-botao strong {
    display: block;
    font-size: 16px;
    font-weight: 600;
}

.texto-botao small {
    display: block;
    font-size: 12px;
    line-height: 1.4;
    margin-top: 5px;
    opacity: .85;
}

.seta {
    font-size: 25px;
    font-weight: normal;
    opacity: .7;
}

/* CONFIRMAÇÃO DO PIX */

.status {
    min-height: 25px;
    margin-top: 15px;
    font-size: 13px;
    font-weight: bold;
    color: #527b60;
    overflow-wrap: anywhere;
}

.status.ativo {
    animation: confirmacao .4s ease;
}

/* RODAPÉ */

footer {
    margin-top: 25px;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: #986e58;
    line-height: 1.8;
}

footer strong {
    font-weight: 600;
}

/* ANIMAÇÕES */

@keyframes entrada {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes brilho {
    0%, 65% {
        left: -80%;
    }

    90%, 100% {
        left: 140%;
    }
}

@keyframes confirmacao {
    from {
        opacity: 0;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 360px) {
    body {
        padding: 20px 14px;
    }

    h1 {
        font-size: 28px;
    }

    .botao {
        padding: 15px;
        gap: 12px;
    }

    .texto-botao strong {
        font-size: 15px;
    }

    .icone {
        width: 38px;
        height: 38px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}

</style>

</head>

<script>

/* CONFIGURAÇÃO DO PIX */

const chavePix = "+5551981377034";

const botaoPix = document.getElementById("botaoPix");
const textoPix = document.getElementById("textoPix");
const statusPix = document.getElementById("status");

let temporizador;

/* FUNÇÃO PARA COPIAR */

async function copiarPix() {

    clearTimeout(temporizador);

    try {

        if (navigator.clipboard && window.isSecureContext) {

            await navigator.clipboard.writeText(chavePix);

        } else {

            const campo = document.createElement("textarea");

            campo.value = chavePix;
            campo.style.position = "fixed";
            campo.style.opacity = "0";

            document.body.appendChild(campo);

            campo.focus();
            campo.select();

            const copiado = document.execCommand("copy");

            campo.remove();

            if (!copiado) {
                throw new Error("Falha ao copiar");
            }

        }

        textoPix.textContent = "Chave copiada com sucesso!";

        statusPix.textContent = "✓ Chave Pix copiada!";

        statusPix.classList.remove("ativo");

        void statusPix.offsetWidth;

        statusPix.classList.add("ativo");

        if (navigator.vibrate) {
            navigator.vibrate(50);
        }

        temporizador = setTimeout(() => {

            textoPix.textContent =
                "Toque para copiar a chave";

            statusPix.textContent = "";

        }, 4000);

    } catch (erro) {

        textoPix.textContent = "Copie a chave abaixo";

        statusPix.textContent = chavePix;

    }

}

botaoPix.addEventListener("click", copiarPix);

</script>
